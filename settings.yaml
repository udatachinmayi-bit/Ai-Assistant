# settings.yaml
app:
  name: Chinu AI
  environment: development

logging:
  level: INFO
  file_path: "logs/chinu.log"
  log_to_console: true

voice:
  stt_model_path: "tiny.en"
  stt_device: "cpu"
  stt_compute_type: "int8"
  mic_device: null
  mic_sample_rate: 16000
  mic_block_size: 1024
  mic_channels: 1